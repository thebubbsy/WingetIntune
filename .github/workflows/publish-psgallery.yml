name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Test & Publish to PowerShell Gallery
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Pester Unit Tests
        shell: pwsh
        run: |
          if (Test-Path './tests') {
            Import-Module Pester -Force
            $res = Invoke-Pester -Path './tests' -PassThru
            if ($res.FailedCount -gt 0) {
              Write-Error "Pester tests failed. Aborting publish."
              exit 1
            }
          }

      - name: Publish Module to PSGallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            Write-Error "PSGALLERY_API_KEY secret is missing in GitHub repository settings."
            exit 1
          }
          $env:TEMP = "C:\temp"
          $env:TMP = "C:\temp"
          $env:NUGET_PACKAGES = "C:\temp\nuget_cache"
          $env:NUGET_HTTP_CACHE_PATH = "C:\temp\nuget_http_cache"
          New-Item -ItemType Directory -Path "C:\temp", "C:\temp\nuget_cache", "C:\temp\nuget_http_cache" -Force | Out-Null
          
          Import-Module PowerShellGet -Force
          Publish-Module -Path $PWD.Path -NuGetApiKey $env:PSGALLERY_API_KEY -Force -Verbose
